---
# Homepage dashboard deployment

- name: Create Homepage directory
  file:
    path: "{{ compose_base_path }}/homepage"
    state: directory
    mode: '0755'

- name: Create Homepage config directory
  file:
    path: "{{ compose_base_path }}/homepage/config"
    state: directory
    mode: '0755'

- name: Copy Homepage docker-compose file
  copy:
    src: "{{ playbook_dir }}/../../compose/homepage/docker-compose.yml"
    dest: "{{ compose_base_path }}/homepage/docker-compose.yml"
    mode: '0644'

- name: Copy Homepage config files
  copy:
    src: "{{ playbook_dir }}/../../compose/homepage/config/"
    dest: "{{ compose_base_path }}/homepage/config/"
    mode: '0644'
  notify: restart homepage

- name: Create Homepage .env file
  template:
    src: homepage.env.j2
    dest: "{{ compose_base_path }}/homepage/.env"
    mode: '0600'

- name: Start Homepage
  community.docker.docker_compose_v2:
    project_src: "{{ compose_base_path }}/homepage"
    state: present
    pull: always

- name: Wait for Homepage to be ready
  uri:
    url: "http://localhost:3000"
    status_code: 200
  register: homepage_health
  until: homepage_health.status == 200
  retries: 12
  delay: 5
  ignore_errors: true
