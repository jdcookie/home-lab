---
# Arr Stack - Media Management & Automation
# All secrets stored in .env file (never commit to git)

services:
  # ===========================================
  # VPN CONTAINER (All torrent traffic routes through this)
  # ===========================================
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # qBittorrent WebUI (exposed through VPN)
      - "8080:8080"
      # qBittorrent torrent ports
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER:-mullvad}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${VPN_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${VPN_WIREGUARD_ADDRESS}
      - SERVER_CITIES=${VPN_SERVER_CITY:-Zurich}
      - FIREWALL_VPN_INPUT_PORTS=${VPN_FORWARD_PORT:-}
      - WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL=25s
      - TZ=${TZ:-Australia/Melbourne}
      # Refresh the VPN server list weekly. Without this, gluetun only knows the
      # list baked into the image at build time. Mullvad retires relays regularly,
      # so a stale list eventually leaves it connecting to a decommissioned server:
      # WireGuard stays silent, tun0 keeps its address, and all traffic blackholes.
      # (Sep 2026: the image's list was ~12 months old and 10 of 19 Zurich relays
      # in it were dead.) First refresh runs one period after the tunnel is ready.
      - UPDATER_PERIOD=168h
      # Disable Gluetun's built-in blocking (using PiHole instead)
      - BLOCK_MALICIOUS=off
      - BLOCK_SURVEILLANCE=off
      - BLOCK_ADS=off
    volumes:
      - ./gluetun:/gluetun
    restart: unless-stopped
    networks:
      - arr
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================
  # BITTORRENT CLIENT
  # ===========================================
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Australia/Melbourne}
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent/config:/config
      - ${MEDIA_PATH:-/mnt/media}:/media
    mem_limit: 2g
    mem_reservation: 512m
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================
  # FLARESOLVERR - Cloudflare Bypass
  # ===========================================
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-Australia/Melbourne}
    ports:
      - "8191:8191"
    mem_limit: 512m
    mem_reservation: 256m
    restart: unless-stopped
    networks:
      - arr

  # ===========================================
  # INDEXER MANAGER
  # ===========================================
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Australia/Melbourne}
    volumes:
      - ./prowlarr/config:/config
    ports:
      - "9696:9696"
    mem_limit: 512m
    mem_reservation: 256m
    restart: unless-stopped
    networks:
      - arr

  # ===========================================
  # TV SHOW MANAGER
  # ===========================================
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Australia/Melbourne}
    volumes:
      - ./sonarr/config:/config
      - ${MEDIA_PATH:-/mnt/media}:/media
    ports:
      - "8989:8989"
    mem_limit: 1g
    mem_reservation: 256m
    restart: unless-stopped
    networks:
      - arr

  # ===========================================
  # MOVIE MANAGER
  # ===========================================
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Australia/Melbourne}
    volumes:
      - ./radarr/config:/config
      - ${MEDIA_PATH:-/mnt/media}:/media
    ports:
      - "7878:7878"
    mem_limit: 1g
    mem_reservation: 256m
    restart: unless-stopped
    networks:
      - arr

  # ===========================================
  # USER REQUEST INTERFACE
  # ===========================================
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - TZ=${TZ:-Australia/Melbourne}
    volumes:
      - ./jellyseerr/config:/app/config
    ports:
      - "5055:5055"
    mem_limit: 512m
    mem_reservation: 256m
    restart: unless-stopped
    networks:
      - arr

  # ===========================================
  # MEDIA TRANSCODING - Unmanic
  # ===========================================
  unmanic:
    image: josh5/unmanic:latest
    container_name: unmanic
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Australia/Melbourne}
    volumes:
      - ./unmanic/config:/config
      - ${MEDIA_PATH:-/mnt/media}:/library
      - ${UNMANIC_CACHE_PATH:-/tmp/unmanic}:/tmp/unmanic
    ports:
      - "8888:8888"
    devices:
      # Intel QuickSync hardware acceleration
      - /dev/dri:/dev/dri
    mem_limit: 4g
    mem_reservation: 1g
    restart: unless-stopped
    networks:
      - arr

networks:
  arr:
    driver: bridge
