---
# Glances native installation (for non-Docker hosts like Proxmox)

- name: Install Glances dependencies
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: false

- name: Create Glances virtual environment
  command: python3 -m venv /opt/glances-venv
  args:
    creates: /opt/glances-venv/bin/python

- name: Install Glances in virtual environment
  pip:
    name:
      - glances[web]
    virtualenv: /opt/glances-venv
    state: present

- name: Create Glances systemd service
  template:
    src: glances.service.j2
    dest: /etc/systemd/system/glances.service
    mode: '0644'
  notify: restart glances

- name: Enable and start Glances service
  systemd:
    name: glances
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for Glances API to be ready
  uri:
    url: "http://localhost:61208/api/4/cpu"
    status_code: 200
  register: glances_health
  until: glances_health.status == 200
  retries: 12
  delay: 5
  ignore_errors: true
