---
# N8N workflow automation deployment

- name: Create N8N directory
  file:
    path: "{{ compose_base_path }}/n8n"
    state: directory
    mode: '0755'

- name: Create N8N data directory
  file:
    path: "{{ compose_base_path }}/n8n/data"
    state: directory
    mode: '0755'
    owner: '1000'
    group: '1000'

- name: Copy N8N docker-compose file
  copy:
    src: "{{ playbook_dir }}/../../compose/n8n/docker-compose.yml"
    dest: "{{ compose_base_path }}/n8n/docker-compose.yml"
    mode: '0644'

- name: Create N8N .env file
  template:
    src: n8n.env.j2
    dest: "{{ compose_base_path }}/n8n/.env"
    mode: '0600'
  notify: restart n8n

- name: Start N8N
  community.docker.docker_compose_v2:
    project_src: "{{ compose_base_path }}/n8n"
    state: present
    pull: always

- name: Wait for N8N to be ready
  uri:
    url: "http://localhost:5678/healthz"
    status_code: 200
  register: n8n_health
  until: n8n_health.status == 200
  retries: 12
  delay: 5
  ignore_errors: true
