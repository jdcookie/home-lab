---
# Uptime Kuma monitoring deployment

- name: Create monitoring directory
  file:
    path: "{{ compose_base_path }}/monitoring"
    state: directory
    mode: '0755'

- name: Create Uptime Kuma data directory
  file:
    path: "{{ compose_base_path }}/monitoring/data"
    state: directory
    mode: '0755'

- name: Copy monitoring docker-compose file
  copy:
    src: "{{ playbook_dir }}/../../compose/monitoring/docker-compose.yml"
    dest: "{{ compose_base_path }}/monitoring/docker-compose.yml"
    mode: '0644'

- name: Create monitoring .env file
  template:
    src: monitoring.env.j2
    dest: "{{ compose_base_path }}/monitoring/.env"
    mode: '0600'

- name: Start Uptime Kuma
  community.docker.docker_compose_v2:
    project_src: "{{ compose_base_path }}/monitoring"
    state: present
    pull: always

- name: Wait for Uptime Kuma to be ready
  uri:
    url: "http://localhost:3001"
    status_code: 200
  register: uptime_health
  until: uptime_health.status == 200
  retries: 12
  delay: 5
  ignore_errors: true
