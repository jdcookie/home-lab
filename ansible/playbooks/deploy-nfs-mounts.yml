---
# Mount NFS shares from TrueNAS on Docker host

- name: Configure NFS mounts
  # raph (bare_metal) runs the live arr stack + Jellyfin and needs the same
  # hardened TrueNAS mounts as the docker-services VM.
  hosts: docker_hosts:raph
  become: true
  gather_facts: true

  roles:
    - nfs-mounts

  tasks:
    - name: Display mounted shares
      debug:
        msg: "Mounted {{ item.src }} at {{ item.mount_point }}"
      loop: "{{ nfs_mounts }}"
